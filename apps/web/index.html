<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3e8">
  <meta name="description" content="山海一生，一款原创修仙人生模拟器。在山河与岁月之间，走过属于自己的一生。">
  <title>山海一生 · 在山河之间，过你的一生</title>
  <link rel="icon" href="/apps/web/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/apps/web/style.css">
</head>
<body data-theme="light">
  <div class="page-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="welcome" aria-label="山海一生，返回首页">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 23 13 10l5 9 4-5 6 9M9 26h16M18 7h6"/></svg></span>
        <span>山海一生<span class="brand-sub">山河有路，岁月有声</span></span>
      </button>
      <nav class="topnav" aria-label="主要导航">
        <button type="button" data-action="history">前世录 <span id="life-count" class="count">0</span></button>
        <button type="button" data-action="help">游玩指南</button>
        <button id="share-nav" type="button" data-action="share" class="icon-button" aria-label="给此生留影" title="给此生留影" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <button type="button" data-action="settings" class="icon-button" aria-label="偏好与存档"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 17h14M9 4v6M15 14v6"/></svg></button>
      </nav>
    </header>
    <div id="save-warning" role="alert" hidden></div>
    <main id="screen" aria-live="off"></main>
    <footer class="footer"><span>一念入山海，一生有回响。</span><span id="save-status" role="status" aria-live="off">本地档案</span><button type="button" data-action="about">原创世界 · v0.1.0</button></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-header"><div><span id="modal-kicker" class="eyebrow"></span><h2 id="modal-title"></h2></div><button type="button" class="icon-button" data-action="close-modal" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/apps/web/app.js"></script>
</body>
</html>
