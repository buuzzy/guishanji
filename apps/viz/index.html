<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>归山记 · 开发者面板</title>
<link rel="stylesheet" href="/apps/viz/viz.css">
</head>
<body>

<header class="viz-top">
  <div class="viz-titlebar">
    <div class="viz-title">
      <h1>归山记 · 开发者面板</h1>
      <p>跑一条命，把它摊开看。规则与游戏本体是同一份代码，这里只负责画。</p>
    </div>
    <button type="button" id="theme" class="viz-theme">深色</button>
  </div>
  <form id="run-form" class="viz-controls">
    <label>种子<input id="seed" value="万千道途-0" autocomplete="off" spellcheck="false"></label>
    <label>道途
      <select id="path">
        <option value="orthodox">宗门</option>
        <option value="loose">散修</option>
        <option value="demonic">魔道</option>
        <option value="beast">妖身</option>
        <option value="mortal">凡人</option>
      </select>
    </label>
    <label>处世
      <select id="conduct">
        <option value="care">护人</option>
        <option value="cautious">自守</option>
        <option value="selfish">自利</option>
      </select>
    </label>
    <label>技艺
      <select id="school">
        <option value="array">阵法</option>
        <option value="sword">御剑</option>
        <option value="alchemy">丹术</option>
      </select>
    </label>
    <div class="viz-buttons">
      <button type="submit" class="primary">重来</button>
      <button type="button" id="run-all">跑完一生</button>
    </div>
    <label>自动走法
      <select id="auto-mode">
        <option value="policy">按偏好</option>
        <option value="random">随机</option>
      </select>
    </label>
    <div class="viz-buttons">
      <button type="button" id="auto-play">让它自己走</button>
    </div>
  </form>
  <p id="status" class="viz-status"></p>
</header>

<main class="viz-main">

  <section class="viz-card viz-card-track">
    <h2>人生进程<small>横轴是年龄（分段压缩）；轴与下面的曲线同一把尺子，上下对齐</small></h2>
    <div id="track" class="viz-track"></div>
    <p class="viz-hint">点轴上的抉择点 ⇒ 切到「当前状态」页回看那一步。属性曲线的每个点都是引擎状态里的原值。</p>
  </section>

  <section class="viz-card viz-card-batch">
    <h2>批量观测台<small>让系统自己跑几十条命，看内容覆盖到什么程度</small></h2>
    <div class="viz-batch-console">
      <label>条数
        <select id="batch-count">
          <option value="20">20 条</option>
          <option value="40" selected>40 条</option>
          <option value="100">100 条</option>
          <option value="200">200 条</option>
        </select>
      </label>
      <label>玩法
        <select id="batch-mode">
          <option value="policy">固定偏好</option>
          <option value="random">随机探索</option>
          <option value="both">两种都跑（并排比）</option>
        </select>
      </label>
      <button type="button" id="run-batch" class="primary">跑一批</button>
      <span id="batch-status" class="viz-batch-status"></span>
    </div>
    <p class="viz-hint">固定偏好：每条命按「道途 / 处世 / 技艺」走 ⇒ 命与命之间可比。随机探索：在能点的选项里随机挑 ⇒ 能撞出偏好策略永远不走的分支。<b>两种都跑</b> ⇒ 并排比，才知道「哪块内容真的没人走到」。结果在「流水」页。</p>
  </section>

  <div id="tabs" class="viz-tabs"></div>
  <section id="tabpanel" class="viz-card viz-tabpanel" role="tabpanel"></section>

</main>

<script type="module" src="/apps/viz/viz.js"></script>
</body>
</html>
